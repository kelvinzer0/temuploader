[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temuploader"
version = "0.2.0"
description = "Temporary file uploader with automatic fallback across multiple providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "temuploader" }]
keywords = ["upload", "temporary", "file-sharing", "pastebin", "cli"]

[project.scripts]
temuploader = "temuploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["temuploader"]
