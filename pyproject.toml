[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temuploader"
version = "0.2.1"
description = "Temporary file uploader with automatic fallback across multiple providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "kelvinzer0", email = "kelvinzer0@users.noreply.github.com" }]
keywords = ["upload", "temporary", "file-sharing", "pastebin", "cli", "fallback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kelvinzer0/temuploader"
Repository = "https://github.com/kelvinzer0/temuploader"
Issues = "https://github.com/kelvinzer0/temuploader/issues"

[project.scripts]
temuploader = "temuploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["temuploader"]
